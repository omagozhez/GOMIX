<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background (required for maskable) -->
  <rect width="512" height="512" fill="#E8620A"/>
  <!-- Snowflake (slightly smaller to stay in safe zone) -->
  <line x1="256" y1="140" x2="256" y2="372" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <line x1="140" y1="256" x2="372" y2="256" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <line x1="175" y1="175" x2="337" y2="337" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <line x1="337" y1="175" x2="175" y2="337" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <!-- Tips top -->
  <line x1="256" y1="165" x2="228" y2="137" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="165" x2="284" y2="137" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Tips bottom -->
  <line x1="256" y1="347" x2="228" y2="375" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="347" x2="284" y2="375" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Tips left -->
  <line x1="165" y1="256" x2="137" y2="228" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="165" y1="256" x2="137" y2="284" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Tips right -->
  <line x1="347" y1="256" x2="375" y2="228" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="347" y1="256" x2="375" y2="284" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Center -->
  <circle cx="256" cy="256" r="20" fill="white"/>
</svg>
