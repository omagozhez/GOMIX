<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GOMIX</title>
  <meta name="description" content="Antojitos y bebidas a domicilio">
  <meta name="theme-color" content="#E8620A">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GOMIX">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }
    body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f7f5; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
    #root { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100%; padding: 0 16px; }
    input, textarea, select, button { font-family: inherit; }
    input, textarea, select { font-size: 15px; padding: 11px 14px; border-radius: 10px; border: 1.5px solid #e0e0e0; background: #fff; color: #1a1a1a; width: 100%; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #E8620A; box-shadow: 0 0 0 3px rgba(232,98,10,.13); }
    textarea { resize: vertical; line-height: 1.5; }
    button { cursor: pointer; }
    img { display: block; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes popIn   { 0% { transform: scale(.7); opacity: 0; } 80% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
    .skel { background: linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    .fadein { animation: fadeIn .25s ease both; }
    /* Floating cart button */
    #cart-fab {
      position: fixed; bottom: 24px; right: 16px; z-index: 100;
      width: 58px; height: 58px; border-radius: 50%; background: #E8620A;
      border: none; box-shadow: 0 4px 16px rgba(232,98,10,.45);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s;
    }
    #cart-fab:active { transform: scale(.93); }
    #cart-fab .badge {
      position: absolute; top: -2px; right: -2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #1a1a1a; color: #fff;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid #fff;
    }
    .toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1a1a1a; color: #fff; padding: 9px 20px; border-radius: 24px;
      font-size: 13px; font-weight: 600; z-index: 200;
      animation: fadeIn .2s ease, fadeOut .3s ease 1.5s both;
      white-space: nowrap;
    }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(8px); } }
    .status-nuevo       { background: #FEF3C7; color: #92400E; }
    .status-en_proceso  { background: #DBEAFE; color: #1E40AF; }
    .status-entregado   { background: #D1FAE5; color: #065F46; }
    .status-cancelado   { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

/* ══════════════════════════════════════════════════════
   CONFIG — edita estos valores para activar la nube
   Deja vacío ('') para modo demo con localStorage
══════════════════════════════════════════════════════ */
const CFG = {
  supabaseUrl : '',          // ej. 'https://xxxx.supabase.co'
  supabaseKey : '',          // anon/public key de Supabase
  whatsapp    : '',          // teléfono con código de país: '5215512345678'
  adminPin    : '9999',      // cambia este PIN (min. 4 caracteres)
};

/* ── Supabase client (null = modo localStorage) ── */
const sb = (CFG.supabaseUrl && CFG.supabaseKey)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey)
  : null;

/* ══════════════════════════════════════════════════════
   DATOS INICIALES (demo / fallback sin Supabase)
══════════════════════════════════════════════════════ */
const INIT_PRODUCTS = [
  { id:1, producto:'Gomiboing de mango',   categoria:'Gomiboing', precio:35, descripcion:'Fresco Boing congelado sabor mango con toppings a elegir añadidos.',        imagen:'https://images.unsplash.com/photo-1546173159-315724a31696?w=600&auto=format&fit=crop' },
  { id:2, producto:'Gomiboing de uva',     categoria:'Gomiboing', precio:35, descripcion:'Fresco Boing congelado sabor uva con toppings a elegir añadidos.',          imagen:'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=600&auto=format&fit=crop' },
  { id:3, producto:'Gomiboing de fresa',   categoria:'Gomiboing', precio:35, descripcion:'Fresco Boing congelado sabor fresa con toppings a elegir añadidos.',        imagen:'https://images.unsplash.com/photo-1553361371-9b22f78e8b1d?w=600&auto=format&fit=crop' },
  { id:4, producto:'Gomiboing de guayaba', categoria:'Gomiboing', precio:35, descripcion:'Fresco Boing congelado sabor guayaba con toppings a elegir añadidos.',      imagen:'https://images.unsplash.com/photo-1621955964441-c173e01c135b?w=600&auto=format&fit=crop' },
  { id:5, producto:'Gomiboing de manzana', categoria:'Gomiboing', precio:35, descripcion:'Fresco Boing congelado sabor manzana con toppings a elegir añadidos.',      imagen:'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&auto=format&fit=crop' },
  { id:6, producto:'Frape de oreo',        categoria:'Frape',     precio:50, descripcion:'Cremoso frappé helado de galleta Oreo, decorado con jarabe de chocolate.', imagen:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&auto=format&fit=crop' },
  { id:7, producto:'Frape de fresa',       categoria:'Frape',     precio:50, descripcion:'Suave frappé sabor fresa intensa, dulce y refrescante.',                   imagen:'https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=600&auto=format&fit=crop' },
  { id:8, producto:'Frape de cajeta',      categoria:'Frape',     precio:50, descripcion:'Frappé cremoso con el toque dulce y tradicional de la cajeta.',            imagen:'https://images.unsplash.com/photo-1534353436294-0dbd4bdac845?w=600&auto=format&fit=crop' },
];
const EMPTY_PROD = { producto:'', categoria:'', precio:'', descripcion:'', imagen:'' };
const STATUS_LABELS = { nuevo:'Nuevo', en_proceso:'En proceso', entregado:'Entregado', cancelado:'Cancelado' };

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
const store = {
  get : (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch{return d;} },
  set : (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch{} },
};
const mxn = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n));
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const fallback = cat => cat==='Frape' ? 'cup' : 'snowflake';

/* Upload image: Supabase Storage if available, else base64 */
const uploadImg = async (file) => {
  if (sb) {
    const ext  = (file.name.split('.').pop()||'jpg').toLowerCase();
    const path = `${uid()}.${ext}`;
    const { error } = await sb.storage.from('product-images').upload(path, file, { upsert:true });
    if (error) throw error;
    const { data } = sb.storage.from('product-images').getPublicUrl(path);
    return data.publicUrl;
  }
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload  = ev => res(ev.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
};

/* ══════════════════════════════════════════════════════
   BASE COMPONENTS
══════════════════════════════════════════════════════ */
const B=`#E8620A`, BL=`#FFF8F5`, BD=`#B54C08`, GRAY=`#6B7280`;

const Icon = ({name,sz=18,style:s}) =>
  h('i',{className:`ti ti-${name}`,style:{fontSize:sz,lineHeight:1,...s},'aria-hidden':true});

const Btn = ({onClick,bg=B,fg='#fff',border='none',full=true,disabled,children,small}) =>
  h('button',{onClick,disabled,style:{
    width:full?'100%':'auto', padding:small?'9px 14px':'13px 20px',
    borderRadius:12, background:disabled?'#ccc':bg, color:disabled?'#fff':fg, border,
    fontSize:small?13:15, fontWeight:700, cursor:disabled?'not-allowed':'pointer',
    display:'flex', alignItems:'center', justifyContent:'center', gap:8,
    transition:'opacity .15s', WebkitTapHighlightColor:'transparent',
  }},...children);

const Field = ({label,icon,err,children}) =>
  h('div',null,
    h('label',{style:{fontSize:13,fontWeight:600,color:GRAY,display:'block',marginBottom:7}},
      h(Icon,{name:icon,sz:14,style:{verticalAlign:-2,marginRight:4}}),label),
    children,
    err&&h('span',{style:{fontSize:12,color:'#C62828',marginTop:5,display:'block',fontWeight:500}},
      h(Icon,{name:'alert-circle',sz:12,style:{verticalAlign:-1,marginRight:3}}),err)
  );

const BackBar = ({onBack,title}) =>
  h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'14px 0',borderBottom:'1px solid #f0f0f0',marginBottom:18,position:'sticky',top:0,background:'#fff',zIndex:10}},
    h('button',{onClick:onBack,style:{background:'none',border:'none',padding:'5px 6px',cursor:'pointer',color:GRAY,display:'flex',lineHeight:1,borderRadius:8}},
      h(Icon,{name:'arrow-left',sz:24})),
    h('span',{style:{fontSize:17,fontWeight:700,flex:1}},title)
  );

/* Skeleton card */
const SkProd = () => h('div',{style:{borderRadius:14,overflow:'hidden',border:'1px solid #efefef'}},
  h('div',{className:'skel',style:{height:130}}),
  h('div',{style:{padding:'10px 12px 13px'}},
    h('div',{className:'skel',style:{height:10,width:'55%',marginBottom:8}}),
    h('div',{className:'skel',style:{height:14,width:'85%',marginBottom:10}}),
    h('div',{className:'skel',style:{height:17,width:'40%'}})
  )
);

/* Product image with error fallback */
const ProductImg = ({src,id,imgErrs,setImgErrs,h:ht=130,icon='snowflake'}) => {
  if (src && !imgErrs[id])
    return h('img',{key:src.slice(-30),src,alt:'',style:{width:'100%',height:'100%',objectFit:'cover'},onError:()=>setImgErrs(e=>({...e,[id]:true}))});
  return h(Icon,{name:icon,sz:Math.round(ht*.32),style:{color:B}});
};

/* ══════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════ */
function App() {
  /* ── core state ── */
  const [screen,     setScreen]     = useState('home');
  const [products,   setProducts]   = useState(INIT_PRODUCTS);
  const [loadingP,   setLoadingP]   = useState(true);
  const [cart,       setCart]       = useState([]);
  const [orders,     setOrders]     = useState(()=>store.get('gomix_orders',[]));
  const [buyForm,    setBuyForm]    = useState({nombre:'',pago:'efectivo',direccion:''});
  const [buyErrs,    setBuyErrs]    = useState({});
  const [sel,        setSel]        = useState(null);
  const [qty,        setQty]        = useState(1);
  const [cat,        setCat]        = useState('Todos');
  const [imgErrs,    setImgErrs]    = useState({});
  const [toast,      setToast]      = useState(null);
  /* ── admin state ── */
  const [pin,        setPin]        = useState('');
  const [pinErr,     setPinErr]     = useState(false);
  const [adminTab,   setAdminTab]   = useState('pedidos');
  const [editId,     setEditId]     = useState(null);
  const [prodForm,   setProdForm]   = useState(EMPTY_PROD);
  const [prodErrs,   setProdErrs]   = useState({});
  const [delId,      setDelId]      = useState(null);
  const [imgLoading, setImgLoading] = useState(false);
  const [savingProd, setSavingProd] = useState(false);
  const [statusSel,  setStatusSel]  = useState(null);
  const pinRef     = useRef(null);
  const imgInputRef= useRef(null);
  const toastTimer = useRef(null);

  /* ── cart helpers ── */
  const cartCount = cart.reduce((s,i)=>s+i.qty,0);
  const cartTotal = cart.reduce((s,i)=>s+i.precio*i.qty,0);

  const addToCart = (product, amount) => {
    setCart(prev => {
      const ex = prev.find(i=>i.id===product.id);
      if (ex) return prev.map(i=>i.id===product.id?{...i,qty:i.qty+amount}:i);
      return [...prev, {...product, qty:amount}];
    });
    showToast(`✓ ${product.producto} agregado`);
  };
  const updateQty = (id, nq) => {
    if (nq<=0) setCart(prev=>prev.filter(i=>i.id!==id));
    else       setCart(prev=>prev.map(i=>i.id===id?{...i,qty:nq}:i));
  };
  const clearCart = () => setCart([]);

  /* ── toast ── */
  const showToast = msg => {
    clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(()=>setToast(null), 2000);
  };

  /* ── persist orders to localStorage ── */
  useEffect(()=>{ if(!sb) store.set('gomix_orders',orders); },[orders]);

  /* ── scroll top on screen change ── */
  useEffect(()=>{ window.scrollTo(0,0); },[screen]);

  /* ── focus PIN ── */
  useEffect(()=>{ if(screen==='adminLogin') setTimeout(()=>pinRef.current?.focus(),120); },[screen]);

  /* ── load products ── */
  useEffect(()=>{
    const load = async()=>{
      setLoadingP(true);
      if(sb){
        const {data,error} = await sb.from('products').select('*').eq('activo',true).order('orden',{ascending:true}).order('created_at',{ascending:true});
        if(!error && data) setProducts(data);
        else setProducts(store.get('gomix_products',INIT_PRODUCTS));
      } else {
        setProducts(store.get('gomix_products',INIT_PRODUCTS));
      }
      setLoadingP(false);
    };
    load();
  },[]);

  /* ── load orders (admin) + realtime ── */
  useEffect(()=>{
    if(screen!=='admin' || !sb) return;
    sb.from('orders').select('*').order('created_at',{ascending:false}).then(({data})=>{ if(data) setOrders(data); });
    const ch = sb.channel('gomix-orders')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},
          p=>setOrders(prev=>[p.new,...prev]))
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},
          p=>setOrders(prev=>prev.map(o=>o.id===p.new.id?p.new:o)))
      .subscribe();
    return ()=>sb.removeChannel(ch);
  },[screen]);

  /* ── product CRUD ── */
  const startNew  = ()=>{ setProdForm(EMPTY_PROD); setProdErrs({}); setImgLoading(false); setEditId('new'); };
  const startEdit = p=>{ setProdForm({...p,precio:String(p.precio)}); setProdErrs({}); setImgLoading(false); setEditId(p.id); };
  const cancelEdit= ()=>{ setEditId(null); setProdErrs({}); };

  const validateProd = ()=>{
    const e={};
    if(!prodForm.producto.trim())    e.producto='Nombre requerido';
    if(!prodForm.categoria.trim())   e.categoria='Categoría requerida';
    if(!prodForm.precio||isNaN(+prodForm.precio)||+prodForm.precio<=0) e.precio='Precio inválido';
    if(!prodForm.descripcion.trim()) e.descripcion='Descripción requerida';
    setProdErrs(e);
    return !Object.keys(e).length;
  };

  const saveProd = async()=>{
    if(!validateProd()) return;
    setSavingProd(true);
    const p = {...prodForm, precio:Number(prodForm.precio)};
    try {
      if(sb){
        if(editId==='new'){
          const {data,error}=await sb.from('products').insert([p]).select();
          if(!error && data) setProducts(prev=>[...prev,data[0]]);
        } else {
          const {error}=await sb.from('products').update(p).eq('id',editId);
          if(!error){ setProducts(prev=>prev.map(x=>x.id===editId?{...x,...p}:x)); if(sel?.id===editId) setSel(s=>({...s,...p})); }
        }
        store.set('gomix_products',products);
      } else {
        if(editId==='new'){ const np={...p,id:uid()}; setProducts(prev=>{const n=[...prev,np]; store.set('gomix_products',n); return n;}); }
        else { setProducts(prev=>{const n=prev.map(x=>x.id===editId?{...x,...p}:x); store.set('gomix_products',n); return n;}); if(sel?.id===editId) setSel(s=>({...s,...p})); }
      }
      setEditId(null);
    } finally { setSavingProd(false); }
  };

  const deleteProd = async()=>{
    if(sb) await sb.from('products').update({activo:false}).eq('id',delId);
    setProducts(prev=>{ const n=prev.filter(p=>p.id!==delId); store.set('gomix_products',n); return n; });
    setDelId(null);
  };

  const updateOrderStatus = async(orderId,status)=>{
    if(sb) await sb.from('orders').update({status}).eq('id',orderId);
    setOrders(prev=>prev.map(o=>o.id===orderId?{...o,status}:o));
    setStatusSel(null);
  };

  /* ── field helpers ── */
  const pf=(k,v)=>{ setProdForm(f=>({...f,[k]:v})); setProdErrs(e=>({...e,[k]:''})); };
  const bf=(k,v)=>{ setBuyForm(f=>({...f,[k]:v}));  setBuyErrs(e=>({...e,[k]:''})); };

  /* ── image picker ── */
  const pickImage = e=>{ e.stopPropagation(); imgInputRef.current?.click(); };
  const onImgPicked = async e=>{
    const file=e.target.files?.[0]; if(!file) return;
    setImgLoading(true);
    try { const url=await uploadImg(file); setProdForm(f=>({...f,imagen:url})); }
    catch { showToast('Error al cargar imagen'); }
    finally { setImgLoading(false); e.target.value=''; }
  };

  /* ── auth ── */
  const doLogin=()=>{ if(pin===CFG.adminPin){setScreen('admin');setPin('');setPinErr(false);setAdminTab('pedidos');setEditId(null);setDelId(null);setStatusSel(null);}else{setPinErr(true);setPin('');} };
  const goHome=()=>setScreen('home');

  /* ── submit order ── */
  const submitOrder = async()=>{
    const e={};
    if(!buyForm.nombre.trim())    e.nombre='Escribe tu nombre';
    if(!buyForm.direccion.trim()) e.direccion='Escribe tu dirección';
    if(Object.keys(e).length){setBuyErrs(e);return;}
    const order={id:uid(),items:[...cart],total:cartTotal,...buyForm,status:'nuevo',fecha:new Date().toLocaleString('es-MX')};
    if(sb){
      await sb.from('orders').insert([{items:cart,total:cartTotal,nombre:buyForm.nombre,pago:buyForm.pago,direccion:buyForm.direccion,status:'nuevo'}]);
    } else {
      setOrders(prev=>[order,...prev]);
    }
    clearCart();
    setScreen('done');
    // WhatsApp
    if(CFG.whatsapp){
      const lines=cart.map(i=>`• ${i.producto} x${i.qty} — ${mxn(i.precio*i.qty)}`).join('\n');
      const msg=`🛍️ *Nuevo pedido GOMIX*\n\n${lines}\n\n*Total:* ${mxn(cartTotal)}\n*Nombre:* ${buyForm.nombre}\n*Pago:* ${buyForm.pago==='efectivo'?'Efectivo':'Transferencia'}\n*Dirección:* ${buyForm.direccion}`;
      setTimeout(()=>window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank'),600);
    }
  };

  /* ── derived ── */
  const cats   = ['Todos',...new Set(products.map(p=>p.categoria).filter(Boolean))];
  const adminCats = [...new Set(products.map(p=>p.categoria).filter(Boolean))];
  const visible= cat==='Todos'?products:products.filter(p=>p.categoria===cat);

  /* ════════════════════════════════════════
     FLOATING CART BUTTON (global)
  ════════════════════════════════════════ */
  const CartFAB = ()=> cartCount>0 && !['cart','checkout','adminLogin','admin'].includes(screen)
    ? h('button',{id:'cart-fab',onClick:()=>setScreen('cart'),'aria-label':'Ver carrito'},
        h(Icon,{name:'shopping-cart',sz:24,style:{color:'#fff'}}),
        h('div',{className:'badge'},cartCount)
      ) : null;

  /* ════════════════════════════════════════
     SCREEN: HOME
  ════════════════════════════════════════ */
  if(screen==='home') return h('div',{style:{paddingBottom:100}},
    h(CartFAB),
    toast && h('div',{className:'toast'},toast),
    /* header */
    h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'18px 0 16px',borderBottom:'1px solid #f0f0f0',marginBottom:16}},
      h('div',{style:{width:44,height:44,borderRadius:13,background:B,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
        h(Icon,{name:'snowflake',sz:24,style:{color:'#fff'}})),
      h('div',{style:{flex:1}},
        h('div',{style:{fontSize:26,fontWeight:800,color:B,lineHeight:1}},'GOMIX'),
        h('div',{style:{fontSize:12,color:GRAY,marginTop:2}},'Antojitos y bebidas a domicilio')
      ),
      h('button',{onClick:()=>{setPin('');setPinErr(false);setScreen('adminLogin');},style:{fontSize:13,padding:'7px 12px',borderRadius:9,border:'1.5px solid #e8e8e8',background:'none',cursor:'pointer',color:GRAY,display:'flex',alignItems:'center',gap:5,fontWeight:500}},
        h(Icon,{name:'lock',sz:14}),' Admin')
    ),
    /* cloud status */

            h('div',{style:{fontSize:19,fontWeight:800}},s.val)
          ))
      ),
      /* tabs */
      h('div',{style:{display:'flex',border:'1.5px solid #ebebeb',borderRadius:12,overflow:'hidden',marginBottom:18}},
        [{k:'pedidos',label:'Pedidos',icon:'receipt'},{k:'productos',label:'Catálogo',icon:'package'}].map(t=>
          h('button',{key:t.k,onClick:()=>setAdminTab(t.k),style:{flex:1,padding:'12px',background:adminTab===t.k?B:'#fff',color:adminTab===t.k?'#fff':GRAY,border:'none',cursor:'pointer',fontSize:14,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:7}},
            h(Icon,{name:t.icon,sz:16}),t.label)
        )
      ),
      /* TAB: PEDIDOS */
      adminTab==='pedidos' && (orders.length===0
        ? h('div',{style:{textAlign:'center',padding:'3rem 1rem'}},
            h(Icon,{name:'inbox',sz:52,style:{color:'#ddd',display:'block',margin:'0 auto 12px'}}),
            h('div',{style:{fontSize:15,color:GRAY}},'Aún no hay pedidos'))
        : h('div',null,orders.map(o=>{
            const items = Array.isArray(o.items)?o.items:[];
            return h('div',{key:o.id,className:'fadein',style:{background:'#fff',border:'1px solid #efefef',borderRadius:14,padding:'13px 15px',marginBottom:10}},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}},
                h('span',{style:{fontSize:16,fontWeight:800}},o.nombre),
                h('span',{style:{fontSize:16,fontWeight:800,color:B}},mxn(o.total))
              ),
              /* items */
              items.map((i,idx)=>h('div',{key:idx,style:{fontSize:13,color:'#555',marginBottom:2}},
                h(Icon,{name:'circle-dot',sz:11,style:{verticalAlign:-1,marginRight:4,color:GRAY}}),
                i.producto,' × ',i.qty,' — ',mxn(i.precio*i.qty)
              )),
              /* address + payment */
              h('div',{style:{display:'flex',gap:12,marginTop:8,paddingTop:8,borderTop:'1px solid #f5f5f5',flexWrap:'wrap'}},
                h('span',{style:{fontSize:12,color:GRAY}},h(Icon,{name:'map-pin',sz:12,style:{verticalAlign:-1,marginRight:3}}),o.direccion),
                h('span',{style:{fontSize:12,color:GRAY}},h(Icon,{name:'cash',sz:12,style:{verticalAlign:-1,marginRight:3}}),o.pago==='efectivo'?'Efectivo':'Transferencia')
              ),
              /* status + date */
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}},
                h('button',{onClick:()=>setStatusSel(o.id),className:`status-${o.status||'nuevo'}`,style:{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:20,border:'none',cursor:'pointer'}},
                  STATUS_LABELS[o.status||'nuevo'],' ▾'),
                h('span',{style:{fontSize:11,color:'#bbb'}},o.fecha||o.created_at?.slice(0,16)?.replace('T',' '))
              )
            );
          }))
      ),
      /* TAB: CATÁLOGO */
      adminTab==='productos' && h('div',null,
        h('button',{onClick:startNew,style:{width:'100%',padding:'13px',background:BL,color:BD,border:`2px dashed ${B}`,borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:12}},
          h(Icon,{name:'plus',sz:18}),'Agregar nuevo producto'),
        products.map(p=>h('div',{key:p.id,style:{background:'#fff',border:'1px solid #efefef',borderRadius:14,padding:'10px 12px',marginBottom:10,display:'flex',alignItems:'center',gap:12}},
          h('div',{style:{width:58,height:58,borderRadius:10,background:'#f5f5f5',overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}},
            h(ProductImg,{src:p.imagen,id:p.id,imgErrs,setImgErrs,h:58,icon:fallback(p.categoria)})
          ),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontSize:11,color:'#aaa',marginBottom:1}},p.categoria),
            h('div',{style:{fontSize:14,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},p.producto),
            h('div',{style:{fontSize:14,color:B,fontWeight:800,marginTop:2}},mxn(p.precio))
          ),
          h('div',{style:{display:'flex',gap:7,flexShrink:0}},
            h('button',{onClick:()=>startEdit(p),'aria-label':'Editar',style:{width:38,height:38,border:'1.5px solid #e0e0e0',borderRadius:9,background:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:GRAY}},h(Icon,{name:'pencil',sz:17})),
            h('button',{onClick:()=>setDelId(p.id),'aria-label':'Eliminar',style:{width:38,height:38,border:'1.5px solid #F7C1C1',borderRadius:9,background:'#FFF5F5',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#A32D2D'}},h(Icon,{name:'trash',sz:17}))
          )
        ))
      )
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));

if('serviceWorker' in navigator)
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
